name: Build macOS Test Package

on:
  workflow_dispatch:
  push:
    tags: ["macos-test-v*"]

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }} test package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: apple-silicon
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned DMG
        run: npm run tauri:build -- --bundles dmg --target ${{ matrix.target }}

      - name: Prepare test package
        shell: bash
        run: |
          set -euo pipefail
          source_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          package="$(find "$source_dir" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$package"
          mkdir -p macos-test-artifacts
          cp "$package" "macos-test-artifacts/CodexAppManager_${{ matrix.arch }}_unsigned.dmg"

      - name: Upload macOS test package
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-unsigned-dmg
          path: macos-test-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Resolve release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/macos-test-v')
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME#macos-test-}" >> "$GITHUB_OUTPUT"

      - name: Add test package to release downloads
        if: startsWith(github.ref, 'refs/tags/macos-test-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: macos-test-artifacts/*.dmg
          fail_on_unmatched_files: true
