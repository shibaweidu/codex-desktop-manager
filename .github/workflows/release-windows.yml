name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.Substring(1)
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.version -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME requires src-tauri/tauri.conf.json version $expected, found $($config.version)."
          }

      - name: Build Windows installer
        run: npm run tauri:build -- --bundles nsis

      - name: Prepare GitHub Release assets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $assets = "release-assets"
          $bundle = "src-tauri/target/release/bundle/nsis"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $installers = @(Get-ChildItem "$bundle/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one x64 NSIS installer, found $($installers.Count)."
          }
          foreach ($installer in $installers) {
            & .\node_modules\.bin\tauri.cmd signer sign $installer.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $files = @(
            Get-ChildItem "$bundle/*-setup.exe"
            Get-ChildItem "$bundle/*-setup.exe.sig"
          )
          foreach ($file in $files) {
            # GitHub changes spaces in uploaded asset names, so publish a
            # space-free filename that exactly matches latest.json.
            Copy-Item $file.FullName (Join-Path $assets ($file.Name -replace " ", ""))
          }
          node scripts/gen-github-updater-manifest.mjs "$env:GITHUB_REF_NAME" $assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
