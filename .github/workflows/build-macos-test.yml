name: Build macOS Test Package

on:
  workflow_dispatch:
  push:
    tags: ["macos-test-v*"]

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }} test package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: apple-silicon
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned app bundle
        run: npm run tauri:build -- --bundles app --target ${{ matrix.target }} --no-sign --ci

      - name: Prepare test package
        shell: bash
        run: |
          set -euo pipefail
          source_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="$(find "$source_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          mkdir -p macos-test-artifacts
          hdiutil create \
            -volname "Codex App Manager" \
            -srcfolder "$app" \
            -ov \
            -format UDZO \
            "macos-test-artifacts/CodexAppManager_${{ matrix.arch }}_unsigned.dmg"

      - name: Upload macOS test package
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-unsigned-dmg
          path: macos-test-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Resolve release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/macos-test-v')
        shell: bash
        run: |
          release_tag="$(printf '%s\n' "$GITHUB_REF_NAME" | sed -E 's/^macos-test-(v[0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?$/\1/')"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Add test package to release downloads
        if: startsWith(github.ref, 'refs/tags/macos-test-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: macos-test-artifacts/*.dmg
          fail_on_unmatched_files: true
          overwrite_files: true
